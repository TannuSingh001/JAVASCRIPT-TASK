<!DOCTYPE html>
<html>
<head>
    <title>Comparison Operators</title>
</head>
<body>

    <h2>Comparison Operators</h2>

<h1>Implicity conversion == _(automatic)</h1>

    <script>
        let a = 10;
        let b = 5;

        document.write("a == b : " + (a == b) + "<br>");
        document.write("a === b : " + (a === b) + "<br>");
        document.write("a != b : " + (a != b) + "<br>");
        document.write("a > b : " + (a > b) + "<br>");
        document.write("a < b : " + (a < b) + "<br>");
        document.write("a >= b : " + (a >= b) + "<br>");
        document.write("a <= b : " + (a <= b) + "<br>");
    </script>

</body>
</html>
